# Stretch 2 Robot Action Definitions
# This file defines macro actions (complex behaviors) composed of micro actions (primitive commands)
#
# Structure:
#   - micro_actions: Basic robot commands (go to anchor, reset arm, etc.)
#   - macro_actions: Complex behaviors built from micro actions
#
# Usage:
#   Actions can reference other actions, allowing composition and reuse
#   Parameters can be passed to actions for flexibility

# ============================================================================
# MICRO ACTIONS (Primitive Commands)
# ============================================================================
# These are the basic building blocks that the robot can execute directly

micro_actions:
  # Navigation actions
  - name: "go_to_anchor"
    type: "navigation"
    description: "Navigate to a specific anchor point without turning (A, B, C, D, E, F, ORIGIN) (Usage: go_to_anchor anchor=A speed=0.5 position_tolerance=0.15)"
    parameters:
      anchor: "string"  # Anchor identifier: A, B, C, D, E, F, or ORIGIN
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
      position_tolerance: "float"  # Optional: Position tolerance in meters (default: 0.15). Action completes when within this distance of target
    
  - name: "turn_towards"
    type: "navigation"
    description: "Turn robot towards a specific anchor or absolute angle without moving (Usage: turn_towards anchor=ORIGIN speed=0.5 delta_angle=5.0 OR turn_towards degrees=90.0 speed=0.5 delta_angle=5.0)"
    parameters:
      anchor: "string"  # Anchor identifier: A, B, C, D, E, F, or ORIGIN (mutually exclusive with degrees)
      degrees: "float"  # Optional: Absolute target angle in degrees (0-360). Mutually exclusive with anchor. If specified, robot turns to this absolute heading
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
      delta_angle: "float"  # Optional: Delta angle in degrees (default: 5.0). Action completes when within this angle of target heading
    
  - name: "go_to_position"
    type: "navigation"
    description: "Navigate to a specific (x, y) position (Usage: go_to_position x=0.5 y=0.5 speed=0.5)"
    parameters:
      x: "float"  # X position 0-1 (0=min, 0.5=middle, 1=max)
      y: "float"  # Y position 0-1 (0=min, 0.5=middle, 1=max)
      direction: "float"  # Optional: target orientation 0-1 (0=0°, 0.5=180°, 1=360°)
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
    
  # Arm control actions
  - name: "reset_arm"
    type: "arm_control"
    description: "Reset arm to default position (lift up, arm retracted, gripper open, wrist centered) (Usage: reset_arm speed=0.5)"
    parameters:
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). Controls how fast all actuators move together. 0=min, 0.5=middle, 1=max
    
  - name: "elevate_arm"
    type: "arm_control"
    description: "Move lift to a specific height (Usage: elevate_arm height=0.5 speed=0.5)"
    parameters:
      height: "float"  # Height 0-1 (0=min, 0.5=middle, 1=max)
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
    
  - name: "extend_arm"
    type: "arm_control"
    description: "Extend or retract the arm to a specific length (Usage: extend_arm length=0.5 speed=0.5)"
    parameters:
      length: "float"  # Extension length 0-1 (0=min/retracted, 0.5=middle, 1=max/extended)
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
    
  - name: "rotate_wrist"
    type: "arm_control"
    description: "Rotate wrist yaw to a specific angle (Usage: rotate_wrist angle=0.5 speed=0.5)"
    parameters:
      angle: "float"  # Angle 0-1 (0=min, 0.5=middle, 1=max)
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
    
  - name: "open_gripper"
    type: "arm_control"
    description: "Open gripper fully (Usage: open_gripper speed=0.5)"
    parameters:
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
    
  - name: "close_gripper"
    type: "arm_control"
    description: "Close gripper fully (Usage: close_gripper speed=0.5)"
    parameters:
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
    
  - name: "set_gripper"
    type: "arm_control"
    description: "Set gripper to a specific opening width (Usage: set_gripper width=0.5 speed=0.5)"
    parameters:
      width: "float"  # Width 0-1 (0=closed, 0.5=middle, 1=open)
      speed: "float"  # Optional: Speed 0-1 (default: 0.5). 0=min, 0.5=middle, 1=max
    
  # Wait/delay actions
  - name: "wait"
    type: "utility"
    description: "Wait for a specified duration (Usage: wait duration=2.0)"
    parameters:
      duration: "float"  # Duration in seconds
    
  - name: "wait_for_arm"
    type: "utility"
    description: "Wait until arm reaches target position (Usage: wait_for_arm timeout=5.0)"
    parameters:
      timeout: "float"  # Maximum wait time in seconds (optional)

  # RL control actions (two-stage)
  - name: "rl_approach"
    type: "rl_control"
    description: "Stage 1 — use PPO to move EE near the object (Usage: rl_approach target=tomato1 max_steps=200)"

  - name: "rl_grasp_lift"
    type: "rl_control"
    description: "Stage 2 — use PPO to close gripper and lift the object (Usage: rl_grasp_lift target=tomato1 max_steps=300)"

  - name: "rl_pick_object"
    type: "rl_control"
    description: "Single-stage PPO pick (legacy). Use rl_approach + rl_grasp_lift for two-stage."

# ============================================================================
# MACRO ACTIONS (Complex Behaviors)
# ============================================================================
# These are composed of sequences of micro actions and/or other macro actions

macro_actions:
  # Basic macro: Do nothing (stay in place)
  - name: "stay"
    description: "Stay in current position, do nothing"
    sequence:
      - action: "wait"
        parameters:
          duration: 0.1  # Minimal wait to keep action valid
    
  # Object retrieval macros
  - name: "get_tomato"
    description: "Navigate to tomato location and pick it up"
    sequence:
      # 1. Reset arm to safe position and wait for completion
      - action: "reset_arm"
        parameters:
          speed: 0.5
      - action: "wait_for_arm"
        parameters:
          timeout: 10.0

      # 2. Face ORIGIN, then navigate to table 2 right side (tomato location)
      - action: "turn_towards"
        parameters:
          anchor: "ORIGIN"
          speed: 0.5
      - action: "go_to_anchor"
        parameters:
          anchor: "D"
          speed: 0.9

      # 3. Face the table (degrees=90 — calibrate if incorrect for your scene)
      - action: "turn_towards"
        parameters:
          degrees: 90
          speed: 0.5
          delta_angle: 5

      # 4. Open gripper first (safe: arm is still high, wont hit anything)
      - action: "set_gripper"
        parameters:
          width: 1.0
          speed: 0.5
      - action: "wait"
        parameters:
          duration: 0.5

      # 5. Extend arm + rotate wrist before descending
      - action: "extend_arm"
        parameters:
          length: 0.6
          speed: 0.3
      - action: "rotate_wrist"
        parameters:
          angle: 0.5
          speed: 0.3
      - action: "wait_for_arm"
        parameters:
          timeout: 8.0

      # 6. Descend to pick height (0.45 = lift approx -0.005 m; calibrate to table)
      - action: "elevate_arm"
        parameters:
          height: 0.45
          speed: 0.2
      - action: "wait_for_arm"
        parameters:
          timeout: 20.0

      # 7. Close gripper to grasp
      - action: "set_gripper"
        parameters:
          width: 0.0
          speed: 0.5
      - action: "wait"
        parameters:
          duration: 20.0

      # 8. Lift arm
      - action: "elevate_arm"
        parameters:
          height: 0.8
          speed: 0.5
      - action: "wait_for_arm"
        parameters:
          timeout: 5.0

  # ── RL-enhanced macro action: navigation same as get_tomato, arm control via PPO ──
  - name: "rl_get_tomato"
    description: "Navigate to tomato location and use RL (PPO) to pick it up"
    sequence:
      # Phase 1: Navigation (same as get_tomato — no RL)
      - action: "reset_arm"
        parameters:
          speed: 0.5
      - action: "wait_for_arm"
        parameters:
          timeout: 10.0

      - action: "turn_towards"
        parameters:
          anchor: "ORIGIN"
          speed: 0.5
      - action: "go_to_anchor"
        parameters:
          anchor: "G"
          speed: 0.9
      - action: "turn_towards"
        parameters:
          degrees: 180
          speed: 0.5
          delta_angle: 5

      # Phase 2a: RL Stage 1 — approach (move EE near the tomato)
      - action: "rl_approach"
        parameters:
          target: "tomato1"
          max_steps: 1000

      # Phase 2b: RL Stage 2 — grasp & lift (close gripper, raise arm)
      - action: "rl_grasp_lift"
        parameters:
          target: "tomato1"
          max_steps: 1000

  - name: "get_lettuce"
    description: "Navigate to lettuce location and pick it up"
    sequence:
      - action: "reset_arm"
        parameters:
          speed: 0.01
      - action: "turn_towards"
        parameters:
          anchor: "ORIGIN"
          speed: 0.5
      - action: "wait"
        parameters:
          duration: 10
      - action: "go_to_anchor"
        parameters:
          anchor: "A"
          speed: 0.9
      # TODO: Define sequence of actions
      # Lettuce is on table 1, left side
      - action: "wait"
        parameters:
          duration: 0.1
    
  - name: "get_onion"
    description: "Navigate to onion location and pick it up"
    sequence:
      - action: "reset_arm"
        parameters:
          speed: 0.01
      - action: "turn_towards"
        parameters:
          anchor: "ORIGIN"
          speed: 0.5
      - action: "wait"
        parameters:
          duration: 10
      - action: "go_to_anchor"
        parameters:
          anchor: "C"
          speed: 0.9
      # TODO: Define sequence of actions
      # Onion is on table 2, left side
      - action: "wait"
        parameters:
          duration: 0.1
    
  - name: "get_plate"
    description: "Navigate to plate location and pick it up"
    sequence:
      - action: "reset_arm"
        parameters:
          speed: 0.01
      - action: "turn_towards"
        parameters:
          anchor: "ORIGIN"
          speed: 0.5
      - action: "wait"
        parameters:
          duration: 10
      - action: "go_to_anchor"
        parameters:
          anchor: "E"
          speed: 0.9
      # TODO: Define sequence of actions
      # Plates are on table 3
      - action: "wait"
        parameters:
          duration: 0.1
    
  - name: "go_to_knife"
    description: "Navigate to knife location"
    sequence:
      - action: "reset_arm"
        parameters:
          speed: 0.01
      - action: "turn_towards"
        parameters:
          anchor: "ORIGIN"
          speed: 0.5
      - action: "wait"
        parameters:
          duration: 10
      - action: "go_to_anchor"
        parameters:
          anchor: "B"
          speed: 0.9
      # TODO: Define sequence of actions
      # Knife is in the middle of table 1
      - action: "wait"
        parameters:
          duration: 0.1
    
  # Delivery macro
  - name: "deliver"
    description: "Navigate to delivery station and place object"
    sequence:
      - action: "turn_towards"
        parameters:
          anchor: "ORIGIN"
          speed: 0.5
      - action: "wait"
        parameters:
          duration: 10
      - action: "go_to_anchor"
        parameters:
          anchor: "F"
          speed: 0.9
      # TODO: Define sequence of actions
      # Delivery station is on table 3
      # - action: "go_to_anchor"
      #   parameters:
      #     anchor: "E"  # Example anchor near delivery station
      # - action: "elevate_arm"
      #   parameters:
      #     height: 0.5
      # - action: "open_gripper"
      - action: "wait"
        parameters:
          duration: 0.1

# ============================================================================
# ACTION PARAMETERS AND CONSTANTS
# ============================================================================
# Define common parameters and constants that can be referenced in actions

constants:
  # Anchor mappings (to be populated based on actual anchor positions)
  anchors:
    A: "Table 1, left side"
    B: "Table 1, right side"
    C: "Table 2, left side"
    D: "Table 2, right side"
    G: "Table 2, front — pre-pick waypoint for RL arm control"
    E: "Table 3 area"
    F: "Table 3 area"
  
  # Object locations (approximate positions - to be refined)
  object_positions:
    tomato:
      table: 2
      side: "right"
      approximate_y: 4.5
    lettuce:
      table: 1
      side: "left"
      approximate_y: 0.5
    onion:
      table: 2
      side: "left"
      approximate_y: 4.5
    plate:
      table: 3
      approximate_x: 2.4
      approximate_y: 2.5
    knife:
      table: 1
      approximate_x: 0.0
      approximate_y: 0.0
  
  # Arm positions
  arm_positions:
    default_lift: 0.6
    default_arm_extend: 0.0
    default_wrist_yaw: 1.125
    default_gripper: 0.04
    pickup_height: 0.4
    delivery_height: 0.5

